<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8ec5ff">
  <meta name="description" content="스그라88의 브라우저 미니게임 모음">
  <meta property="og:title" content="SGRA 88 — Mini Games">
  <meta property="og:description" content="스그라88 미니게임 대포를 플레이하세요.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://namharu.github.io/sgra88/og.png?v=2">
  <title>SGRA 88 — Mini Games</title>
  <link rel="stylesheet" href="hub-sgra88.css?v=square-grid-1">
</head>
<body>
  <main class="hub">
    <header>
      <a class="logo" href="./"><span></span>SGRA 88</a>
      <p>GAME ARCHIVE</p>
    </header>
    <section class="library" aria-label="게임 목록">
      <a class="game-title" href="games/cannon/" aria-label="대포 게임 시작">
        <span class="number">01</span>
        <span class="name">대포</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="game-title" href="games/highlow/" aria-label="하이로우 게임 시작">
        <span class="number">02</span>
        <span class="name">하이로우</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="game-title" href="games/blackred/" aria-label="블랙레드 게임 시작">
        <span class="number">03</span>
        <span class="name">블랙레드</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="game-title wheel-title" href="games/wheel/" aria-label="돌려돌려 돌림판 게임 시작">
        <span class="number">04</span>
        <span class="name">돌려돌려<br>돌림판</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="game-title coin-title" href="games/coin/" aria-label="동전 앞뒤 게임 시작">
        <span class="number">05</span>
        <span class="name">동전<br>앞뒤</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
    <div class="archive-divider" aria-hidden="true"></div>
    <section class="featured-library" aria-label="동물경주 게임">
      <a class="game-title race-title" href="games/race/" aria-label="동물경주 게임 시작">
        <span class="number">06</span>
        <span class="name">동물경주</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="game-title cliff-title" href="games/cliff/" aria-label="동물격투기 게임 시작">
        <span class="number">07</span>
        <span class="name">동물격투기</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
  </main>
</body>
</html>
