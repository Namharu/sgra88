<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070916">
  <meta name="description" content="별가루를 모으고 운석을 피하는 한 손 조작 네온 우주 미니게임">
  <meta property="og:title" content="STARGLIDE — Neon Survival"><meta property="og:description" content="별가루를 모으고 운석을 피해 최고 기록에 도전하세요."><meta property="og:type" content="website"><meta property="og:image" content="https://namharu.github.io/sgra88/og.png?v=2">
  <title>STARGLIDE — Neon Survival</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark"></span>STARGLIDE</a><div class="top-actions"><button id="soundButton" class="icon-button" type="button" aria-pressed="false">SOUND OFF</button><button id="pauseButton" class="icon-button" type="button">PAUSE</button></div></header>
  <section class="game-card" aria-label="스타글라이드 게임">
    <div class="hud" aria-live="polite"><div><span>SCORE</span><strong id="score">000000</strong></div><div class="center"><span>COMBO</span><strong id="combo">×1</strong></div><div class="right"><span>SHIELDS</span><strong id="lives">◆ ◆ ◆</strong></div></div>
    <div id="canvasWrap" class="canvas-wrap"><canvas id="gameCanvas" aria-label="운석을 피하고 별가루를 모으는 게임 화면"></canvas><div class="scanlines"></div>
      <div id="startScreen" class="overlay visible"><div class="eyebrow">NEON SURVIVAL // 01</div><h1>별 사이를<br><em>미끄러지듯.</em></h1><p>빛나는 별가루를 모으고, 붉은 운석은 피하세요.<br>오래 버틸수록 우주는 더 빨라집니다.</p><button id="startButton" class="primary" type="button"><span>게임 시작</span><b>SPACE</b></button><div class="hint"><span>← → / A D</span><i></i><span>화면 드래그</span></div></div>
      <div id="pauseScreen" class="overlay compact"><div class="eyebrow">SYSTEM PAUSED</div><h2>잠시 정지</h2><button id="resumeButton" class="primary" type="button"><span>계속하기</span><b>P</b></button></div>
      <div id="gameOverScreen" class="overlay compact"><div class="eyebrow">FLIGHT COMPLETE</div><h2>항해 종료</h2><div class="results"><div><span>이번 점수</span><strong id="finalScore">0</strong></div><div><span>최고 기록</span><strong id="bestScore">0</strong></div></div><button id="restartButton" class="primary" type="button"><span>다시 도전</span><b>SPACE</b></button></div>
    </div>
    <footer><span><i class="status"></i>PILOT ONLINE</span><span>COLLECT <b class="cyan">✦</b> / AVOID <b class="coral">●</b></span></footer>
  </section><p class="mobile-note">손가락으로 우주선을 좌우로 움직여 보세요.</p>
</main><script src="game.js"></script>
</body></html>
