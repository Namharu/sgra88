<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8fb"><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><title>돌려돌려 돌림판 — SGRA 88</title><link rel="stylesheet" href="styles.css?v=1"></head><body><main><header><a href="../../"><i></i> 돌려돌려 돌림판</a><span>SGRA 88 RANDOM WHEEL</span></header><section class="layout"><div class="wheel-panel"><div class="title"><small>LUCKY WHEEL</small><h1>행운의 돌림판</h1><div class="speed"><button class="selected" data-speed="1">정상</button><button data-speed="1.65">2배</button></div></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="720" height="720" aria-label="돌림판"></canvas></div><button id="spin" class="spin" type="button">시작</button><div id="winner" class="winner" hidden><small>당첨 결과</small><strong></strong><button id="again" type="button">다시 돌리기</button></div></div><aside><section><small>WHEEL ITEMS</small><h2>돌림판 항목</h2><div class="add-row"><input id="newItem" maxlength="24" placeholder="항목 추가"><button id="add" type="button">＋ 추가</button></div><div id="items" class="items"></div></section><section class="save-box"><small>PERMANENT SAVE</small><h2>영구 저장</h2><div class="save-row"><input id="saveName" maxlength="20" placeholder="저장 이름"><button id="save" type="button">저장</button></div><p>현재 편집 내용은 자동 저장됩니다.</p><div id="presets" class="presets"></div></section></aside></section></main><script src="game.js?v=1"></script></body></html>
