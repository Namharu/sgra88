<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c78a58"><title>동물격투기 — SGRA 88</title><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><link rel="stylesheet" href="styles.css?v=3d2"><link rel="stylesheet" href="intro.css?v=1"></head><body><main><header><a href="../../"><i></i> 동물격투기</a><span>LAST ANIMAL STANDING</span></header><section class="game"><aside><small>SGRA 88 BATTLE</small><h1>동물격투기</h1><p>토끼와 원숭이가 펀치를 주고받으며 상대를 절벽 아래로 밀어내는 자동 대결입니다.</p><label>토끼<input id="name0" value="토끼"></label><label>원숭이<input id="name1" value="원숭이"></label><div id="traits" hidden></div></aside><div class="stage"><div class="hud"><b id="status">준비</b><strong><span id="alive">2</span> ALIVE</strong></div><div id="canvas"></div><div id="countdown"></div><div id="events"></div><div id="intro" class="intro"><small>READY TO BATTLE?</small><h2>오늘의 대결</h2><div class="versus"><div><span>🐰</span><b>토끼</b></div><em>VS</em><div><span>🐵</span><b>원숭이</b></div></div><button id="start">대결 시작</button></div><div id="result" hidden><small>LAST ONE</small><h2 id="winner"></h2><div class="result-actions"><a href="../../">메인으로</a><button id="again" type="button">재경기</button></div></div></div></section></main><script>addEventListener('error',e=>document.querySelector('#status').textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='오류: '+e.reason)</script><script type="module" src="game.js?v=cute6"></script></body></html>
