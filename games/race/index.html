<body><main><header><a href="../../"><i></i> 동물경주</a><span>3D ANIMAL RACE</span></header><section class="game"><aside><small>SGRA 88 RACE</small><h1>동물경주</h1><p>4마리 동물이 장애물을 넘고, 부스터를 쓰고, 옆 트랙 상대를 공격하며 결승선을 향해 달립니다.</p><div class="names"><label>토끼<input value="토끼"></label><label>몽구스<input value="몽구스"></label><label>고양이<input value="고양이"></label><label>닭<input value="닭"></label></div><button id="start">경주 시작</button><button id="again" hidden>다시 경주</button><p class="hint">기본 참가자는 4마리입니다.</p></aside><div class="stage"><div class="hud"><b id="status">준비</b><strong id="timer">0.0</strong></div><div id="canvas"></div><div id="countdown"></div><div id="events"></div><div id="results" hidden><small>FINAL RESULT</small><h2 id="winner"></h2><ol id="standing"></ol></div></div></section></main><script>addEventListener('error',e=>document.querySelector('#status').textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='오류: '+e.reason)</script><script type="module" src="game.js?v=3d3"></script></body></html>
