<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081523"><title>동물경주2 — SGRA 88</title><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><link rel="stylesheet" href="styles.css?v=race2-1"><link rel="stylesheet" href="intro.css?v=race2-1"></head><body><main><header><a href="../../"><i></i> Main</a><span>ANIMATED ANIMAL RACE 2</span></header><section class="game"><aside><small>SGRA 88 RACE 2</small><h1>동물경주2</h1><p>동물들이 실제로 팔다리를 움직이며 긴 트랙을 달리고, 장애물과 공 던지기로 선두를 견제합니다.</p><label class="count-label">참가 동물<select id="playerCount"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><div id="names" class="names"></div><p class="hint">2~8마리 · 레인 높이는 동일합니다.</p></aside><div class="stage"><div class="hud"><b id="status">준비</b><strong id="timer">0.0</strong></div><div id="canvas"></div><div id="countdown"></div><div id="events"></div><div id="intro" class="intro"><small>READY TO RACE?</small><h2>출전 선수</h2><div id="lineup" class="lineup"></div><button id="start">경기 시작</button></div><div id="results" hidden><small>FINAL RESULT</small><h2 id="winner"></h2><div class="result-actions"><a href="../../">메인으로</a><button id="again" type="button">재경기</button></div><ol id="standing"></ol></div></div></section></main><script>addEventListener('error',e=>document.querySelector('#status').textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='오류: '+e.reason)</script><script type="module" src="game.js?v=race2-1"></script></body></html>
