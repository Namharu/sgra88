<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081523"><title>동물격투2 — SGRA 88</title><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><link rel="stylesheet" href="styles.css?v=cliff2-1"><link rel="stylesheet" href="intro.css?v=cliff2-1"></head><body><main><header><a href="../../"><i></i> Main</a><span>ANIMAL BATTLE ROYALE 2</span></header><section class="game"><aside><small>SGRA 88 BATTLE 2</small><h1>동물격투2</h1><p>귀여운 동물들이 원형 경기장에서 자동으로 상대를 찾아 공격합니다. KO 또는 장외로 마지막 한 마리를 가립니다.</p><label class="count-label">참가 동물<select id="playerCount"><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><div id="names" class="names"></div><button id="soundToggle" class="sound" type="button">🔊 사운드 켜짐</button></aside><div class="stage"><div class="hud"><b id="status">준비</b><strong><span id="alive">2</span> ALIVE</strong></div><div id="canvas"></div><div id="countdown"></div><div id="events"></div><div id="intro" class="intro"><small>READY TO BATTLE?</small><h2>출전 선수</h2><div id="lineup" class="lineup"></div><button id="start">대결 시작</button></div><div id="results" hidden><small>LAST ONE</small><h2 id="winner"></h2><p id="finishText"></p><div class="result-actions"><a href="../../">메인으로</a><button id="again" type="button">재경기</button></div><ol id="standing"></ol></div></div></section></main><script>addEventListener('error',e=>document.querySelector('#status').textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='오류: '+e.reason)</script><script type="module" src="game.js?v=cliff2-1"></script></body></html>
