<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10253a">
  <meta name="description" content="다음 카드가 높을지 낮을지 맞히는 스그라88 하이로우 게임">
  <meta property="og:title" content="하이로우 — SGRA 88">
  <meta property="og:description" content="A는 1 또는 14, 조커는 무조건 승리!">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://namharu.github.io/sgra88/og.png?v=2">
  <title>하이로우 — SGRA 88</title>
  <link rel="stylesheet" href="styles.css?v=unified-theme-2">
  <style>.card.back{background:#050505;border:2px solid #17283a;outline:0}.card.back::after{content:"";position:absolute;inset:0;width:auto;aspect-ratio:auto;padding:0;border:0;border-radius:0;background:#050505 url("../../og.png?v=card-back-2") center/100% auto no-repeat;box-shadow:none;transform:none}</style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="게임 목록으로 돌아가기"><span></span>Main</a>
      <div class="rules">A = 1 / 14 · JOKER = WIN</div>
    </header>

    <section class="game" aria-label="하이로우 카드 게임">
      <div class="hud">
        <div><small>연승</small><strong id="streak">0</strong></div>
        <div><small>최고 기록</small><strong id="best">0</strong></div>
      </div>

      <div class="table">
        <div class="title"><span>NEXT CARD?</span><h1>하이 <em>or</em> 로우</h1></div>
        <div class="cards" aria-live="polite">
          <div class="card-wrap"><span>현재 카드</span><div id="currentCard" class="card"></div></div>
          <div class="versus">VS</div>
          <div class="card-wrap"><span>다음 카드</span><div id="nextCard" class="card back"><b>?</b></div></div>
        </div>

        <p id="message" class="message">다음 카드가 더 높을지 낮을지 선택하세요.</p>
        <div class="choices">
          <button id="lowButton" class="choice low" type="button"><span>낮다</span><b>LOW ↓</b></button>
          <button id="highButton" class="choice high" type="button"><span>높다</span><b>HIGH ↑</b></button>
        </div>
        <button id="restartButton" class="restart" type="button" hidden>다시 시작</button>
      </div>
    </section>
  </main>
  <script src="game.js?v=ace-start-1"></script>
</body>
</html>
