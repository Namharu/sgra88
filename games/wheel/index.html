<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10253a"><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><title>룰렛 — SGRA 88</title><link rel="stylesheet" href="styles.css?v=unified-theme-2"><link rel="stylesheet" href="weights.css?v=2"><link rel="stylesheet" href="compact.css?v=4"></head><body><main><header><a href="../../"><i></i> Main</a><span>SGRA 88 ROULETTE</span></header><section class="layout"><div class="wheel-panel"><div class="title title-compact"><div class="speed"><button class="selected" data-speed="1">정상</button><button data-speed="2">2배</button><button data-speed="5">5배</button></div></div><div class="wheel-wrap"><div id="pointerLabel" class="pointer-label" aria-live="polite"></div><div class="pointer"></div><canvas id="wheel" width="720" height="720" aria-label="룰렛"></canvas></div><button id="spin" class="spin" type="button">시작</button></div><aside><section><small>ROULETTE ITEMS</small><h2>룰렛 항목</h2><p class="weight-help">같은 이름은 하나로 합쳐집니다. 가중치 비율에 맞춰 조각 크기와 확률이 자동 계산됩니다.</p><div class="add-row weighted-add"><input id="newItem" maxlength="24" placeholder="항목 추가"><input id="newWeight" type="number" min="1" max="999" value="1" aria-label="추가 가중치"><button id="add" type="button">＋ 추가</button></div><div class="item-head"><span>색상</span><span>항목</span><span>가중치</span><span>확률</span><span></span></div><div id="items" class="items"></div></section><section class="save-box"><small>PERMANENT SAVE</small><h2>영구 저장</h2><div class="save-row"><input id="saveName" maxlength="20" placeholder="저장 이름"><button id="save" type="button">저장</button></div><p>현재 항목과 가중치는 자동 저장됩니다.</p><div id="presets" class="presets"></div></section></aside></section></main><script src="game.js?v=6"></script></body></html>
