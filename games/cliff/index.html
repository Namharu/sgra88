<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#92d2ff">
  <meta name="description" content="동물들이 서로 싸우며 플랫폼에서 살아남는 스그라88 동물격투기">
  <meta property="og:title" content="동물격투기 — SGRA 88">
  <meta property="og:description" content="서로 밀어내며 최후의 한 마리가 살아남는 자동 대결 게임">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://namharu.github.io/sgra88/og.png?v=2">
  <title>동물격투기 — SGRA 88</title>
  <link rel="stylesheet" href="styles.css?v=1">
  <style>
    .fighter.ultimate{z-index:8;animation:ultimate .45s ease}.skill-label{position:absolute;left:50%;bottom:42px;translate:-50% 0;padding:4px 7px;border-radius:4px;background:#ff3d30;color:#fff;font-size:9px;white-space:nowrap;box-shadow:0 0 18px #ffdb3d}.skill-label:empty{display:none}.arena.ultimate-wave{animation:arenaShake .35s ease}@keyframes ultimate{50%{scale:1.9;filter:drop-shadow(0 0 16px #ffde38)}}@keyframes arenaShake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  </style>
  <style>
    .fighter{width:52px;height:64px;font-size:inherit}.avatar{position:relative;width:48px;height:60px;display:block}.head{position:absolute;z-index:5;left:7px;top:-2px;font-style:normal;font-size:34px}.body{position:absolute;z-index:2;left:15px;top:31px;width:22px;height:23px;border-radius:10px 10px 7px 7px;background:#f2c84b;border:2px solid #173d5c}.arm,.leg{position:absolute;z-index:3;display:block;width:8px;border:2px solid #173d5c;background:#f2c84b;transform-origin:50% 2px}.arm{top:34px;height:23px;border-radius:6px}.arm-left{left:9px;rotate:18deg}.arm-right{right:9px;rotate:-18deg}.leg{top:50px;height:17px;border-radius:5px}.leg-left{left:15px}.leg-right{right:15px}.walking .leg-left{animation:legWalk .28s infinite alternate}.walking .leg-right{animation:legWalk .28s infinite alternate-reverse}.fighter.punching .arm-right,.fighter.ultimate .arm-right{animation:punch .25s ease}.fighter.hit .avatar{animation:bodyHit .35s ease}.fighter.out{animation:slowFall 1.05s ease forwards!important}.tag b{display:block;margin-top:1px;font-size:7px}.tag.attack b{color:#d52f2f}.tag.defense b{color:#1677d2}.tag.balance b{color:#397d5c}@keyframes legWalk{to{rotate:22deg;translate:2px 0}}@keyframes punch{50%{height:34px;rotate:-72deg;translate:12px -5px}}@keyframes bodyHit{50%{rotate:-18deg;translate:-4px 3px}}@keyframes slowFall{45%{scale:.85;rotate:35deg;opacity:.9}to{translate:0 45px;scale:.35;rotate:120deg;opacity:0}}
  </style>
  <style>
    .battle{background:radial-gradient(circle at 50% 36%,#dc9b62,#87472f 72%,#452b2a)!important}.arena{overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at center,#c98550 0 46%,#6d3f32 47% 66%,#35282b 67%)}.arena::before{content:"";position:absolute;inset:4% 2% 8%;border-radius:50%;border:14px dotted rgba(245,190,104,.58);filter:drop-shadow(0 3px 1px #553327)}.platform{top:53%!important;width:86%!important;height:68%!important;border:12px solid #9d6843!important;background:radial-gradient(ellipse at 45% 40%,#d8a36b,#b87b4d)!important;box-shadow:0 18px 0 #70452f,0 28px 45px rgba(35,19,19,.45)!important}.platform::before{content:"";position:absolute;inset:10px;border:2px solid rgba(111,67,43,.3);border-radius:50%;box-shadow:inset 0 0 0 28px rgba(255,217,153,.08)}.platform::after{content:"SGRA 88"!important;color:rgba(100,57,38,.18)!important}.crowd{position:absolute;z-index:1;left:5%;right:5%;top:10%;color:#f4be6b;font-size:25px;letter-spacing:10px;white-space:nowrap;overflow:hidden;text-shadow:0 5px #613b31}.countdown{position:absolute;z-index:999;left:50%;top:48%;translate:-50% -50%;color:#fff;font:900 clamp(70px,13vw,130px) "DM Mono",monospace;text-shadow:0 8px 0 rgba(62,37,31,.45),0 0 24px #ffe19a}.body,.arm,.leg{background:var(--fur)!important;border-color:var(--trim)!important}.fighter.hit::after{content:"✦";position:absolute;z-index:12;left:34px;top:20px;color:#fff;font-size:38px;text-shadow:0 0 10px #ffdf62;animation:impact .28s ease}@keyframes impact{from{scale:.2;rotate:-30deg}to{scale:1.6;opacity:0}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="게임 목록으로 돌아가기"><span></span>동물격투기</a>
      <div class="rules">LAST ANIMAL STANDING</div>
    </header>
    <section class="game">
      <div class="setup">
        <div><small>SGRA 88 BATTLE</small><h1>동물격투기</h1><p>동물들이 서로 싸우며 상대를 절벽 밖으로 밀어냅니다. 최후의 한 마리가 승리!</p></div>
        <label>참가자 수<select id="playerCount"></select></label>
        <div id="nameInputs" class="name-inputs"></div>
        <button id="startButton" type="button">게임 시작</button>
      </div>
      <div class="battle">
        <div class="status"><span id="status">참가자를 설정하세요.</span><strong><b id="alive">0</b> ALIVE</strong></div>
        <div id="arena" class="arena" aria-live="polite"><div class="crowd" aria-hidden="true">● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●</div><div id="platform" class="platform"></div><div id="countdown" class="countdown" hidden></div></div>
        <div id="result" class="result" hidden><small>LAST ONE</small><div id="winnerAnimal"></div><h2 id="winnerName"></h2><button id="againButton" type="button">다시 대결</button></div>
      </div>
    </section>
  </main>
  <script src="game.js?v=arena-fight-1"></script>
</body>
</html>
