<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8fd3ff"><title>동물경주 — SGRA 88</title><meta property="og:image" content="https://namharu.github.io/sgra88/og.png"><link rel="stylesheet" href="styles.css?v=cute3"><link rel="stylesheet" href="intro.css?v=1"></head><body><main><header><a href="../../"><i></i> 동물경주</a><span>3D ANIMAL RACE</span></header><section class="game"><aside><small>SGRA 88 RACE</small><h1>동물경주</h1><p>귀여운 4마리 동물이 장애물을 넘고, 부스터를 쓰고, 옆 트랙 상대에게 야구공을 던지며 결승선을 향해 달립니다.</p><div class="names"><label>토끼<input value="토끼"></label><label>원숭이<input value="원숭이"></label><label>고양이<input value="고양이"></label><label>닭<input value="닭"></label></div><p class="hint">기본 참가자는 4마리입니다.</p></aside><div class="stage"><div class="hud"><b id="status">준비</b><strong id="timer">0.0</strong></div><div id="canvas"></div><div id="countdown"></div><div id="events"></div><div id="intro" class="intro"><small>READY TO RACE?</small><h2>출전 선수</h2><div class="lineup"><div><span>🐰</span><b>토끼</b></div><div><span>🐵</span><b>원숭이</b></div><div><span>🐱</span><b>고양이</b></div><div><span>🐔</span><b>닭</b></div></div><button id="start">경기 시작</button></div><div id="results" hidden><small>FINAL RESULT</small><h2 id="winner"></h2><div class="result-actions"><a href="../../">메인으로</a><button id="again" type="button">재경기</button></div><ol id="standing"></ol></div></div></section></main><script>addEventListener('error',e=>document.querySelector('#status').textContent='오류: '+e.message);addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent='오류: '+e.reason)</script><script type="module" src="game.js?v=cute3"></script></body></html>
